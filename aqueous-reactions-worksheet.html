<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reactions in Aqueous Solutions Worksheet</title>
<meta name="description" content="Interactive in-class worksheet for General Chemistry I: electrolytes, precipitation, acid–base and redox reactions, concentration, and chemical analysis.">
<style>
:root{
  --paper:#f5f3ec; --card:#fff; --ink:#19222e; --muted:#566170; --line:#d9d5c7; --line2:#ebe8dd;
  --aq:#0b6e8a; --aq-soft:#d8eef4;
  --good:#17703f; --good-soft:#e2f3e8; --bad:#b0281f; --bad-soft:#fbe8e5; --note:#8a4b00; --note-soft:#fcefd7;
  --pink:#c2256f; --pink-soft:#fbe4ef;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  --r:10px; --hue:var(--aq);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:100%;-webkit-text-size-adjust:100%}
html.big{font-size:118%} html.huge{font-size:136%}
body{margin:0;color:var(--ink);font:1rem/1.5 var(--sans);background-color:var(--paper);
  background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);background-size:28px 28px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--aq);outline-offset:2px}
sub,sup{font-size:.72em;line-height:0}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:99;background:#fff;padding:.5rem .75rem;border-radius:6px}
.wrap{max-width:60rem;margin:0 auto;padding:0 1rem}

/* brand */
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.1rem 0 .8rem}
.kicker{font:650 .72rem/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font:600 1.7rem/1.12 var(--serif);margin:.2rem 0 .25rem;letter-spacing:-.012em}
.how{margin:0;color:var(--muted);font-size:.92rem;max-width:38rem}
.tools{display:flex;gap:.4rem;flex-wrap:wrap}

/* buttons */
.btn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:.5rem .95rem;font-weight:600;font-size:.92rem;line-height:1.2}
.btn:hover{background:#2b3847}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);background:#fff}
.btn.small{padding:.34rem .65rem;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* sticky bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(245,243,236,.95);backdrop-filter:blur(6px);border-block:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:.5rem;max-width:60rem;margin:0 auto;padding:.4rem 1rem}
.tabs{display:flex;gap:.25rem;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:.4rem;white-space:nowrap;border:1.5px solid transparent;background:none;border-radius:999px;padding:.3rem .7rem .3rem .32rem;font-size:.86rem;font-weight:600;color:var(--muted)}
.tab .tn{display:grid;place-items:center;width:1.55rem;height:1.55rem;border-radius:50%;background:#fff;border:1.5px solid var(--line);font:700 .78rem var(--mono);color:var(--ink)}
.tab .tc{display:none;font:600 .74rem var(--sans);font-variant-numeric:tabular-nums;color:var(--muted)}
.tab[aria-selected="true"] .tc{display:inline}
.tab.done .tn{background:var(--good);border-color:var(--good);color:#fff}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:#fff;border-color:var(--ink);color:var(--ink)}
.tab[aria-selected="true"] .tn{background:var(--ink);border-color:var(--ink);color:#fff}
.timer{display:flex;align-items:center;gap:.4rem;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.32rem .7rem;font:600 .84rem var(--mono);white-space:nowrap}
.timer.on{border-color:var(--ink)}
.timer .t-pace{font:600 .74rem var(--sans);color:var(--muted)}
.timer.late .t-pace{color:var(--bad)}
@media(max-width:760px){.tab .tt,.tab .tc{display:none}.tab{padding:.25rem}.tab[aria-selected="true"] .tt{display:inline}.tab[aria-selected="true"]{padding-right:.7rem}.timer .t-pace{display:none}h1{font-size:1.4rem}}

/* part */
.panel{padding:1.2rem 0 3rem}
.part-head{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:start;border-top:4px solid var(--hue);background:var(--card);border-radius:0 0 var(--r) var(--r);border-inline:1px solid var(--line);border-bottom:1px solid var(--line);padding:1rem 1.1rem;margin-bottom:1rem}
.pn{font:600 3rem/0.9 var(--serif);color:var(--hue)}
.part-head h2{font:600 1.45rem/1.15 var(--serif);margin:0 0 .3rem}
.lead{margin:0;color:#36414f;max-width:44rem}
.pmin{font:650 .74rem var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding-top:.3rem}
@media(max-width:560px){.part-head{grid-template-columns:auto 1fr}.pmin{grid-column:1/-1;padding:0}}
.part-nav{display:flex;justify-content:space-between;gap:.5rem;margin-top:1.4rem}

/* activity card */
.act{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem 1.05rem;margin-bottom:.9rem;scroll-margin-top:4.5rem}
.act-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.35rem}
.act-num{font:700 .82rem var(--mono);color:#fff;background:var(--hue);border-radius:5px;padding:.14rem .42rem}
.act h3{font:600 1.12rem/1.2 var(--serif);margin:0;flex:1;min-width:10rem}
.tag{font:650 .68rem var(--sans);letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:.16rem .55rem;background:var(--pink-soft);color:var(--pink)}
.status{font:650 .72rem var(--sans);letter-spacing:.04em;border-radius:999px;padding:.18rem .6rem;background:var(--line2);color:var(--muted);white-space:nowrap}
.status.s-tried{background:var(--note-soft);color:var(--note)}
.status.s-correct{background:var(--good-soft);color:var(--good)}
.status.s-revealed{background:var(--aq-soft);color:var(--aq)}
.prompt{margin:.2rem 0 .8rem}
.actions{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.9rem}
.fb,.hintbox,.solbox{margin-top:.75rem;border-radius:8px;padding:.6rem .8rem;font-size:.95rem;border-left:4px solid}
.fb.good{background:var(--good-soft);border-color:var(--good)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb.note,.hintbox{background:var(--note-soft);border-color:var(--note)}
.solbox{background:var(--aq-soft);border-color:var(--aq);overflow-x:auto}
.solbox h4,.hintbox h4{margin:0 0 .25rem;font:700 .72rem var(--sans);letter-spacing:.08em;text-transform:uppercase}
.solbox p,.solbox ul,.solbox ol{margin:.3rem 0}.solbox ul,.solbox ol{padding-left:1.2rem}
.chem{font-family:var(--serif);font-size:1.06em}
.nw{white-space:nowrap}
.st{font-size:.82em;font-style:italic;color:var(--muted)}
.eqblock{display:block;font-family:var(--serif);font-size:1.1em;margin:.3rem 0}

/* marks */
.mark{display:inline-block;min-width:1.3rem;text-align:center;font-weight:800}
.ok>.mark::before,.ok .nfield>.mark::before{content:"\2713";color:var(--good)}
.no>.mark::before,.no .nfield>.mark::before{content:"\2717";color:var(--bad)}

/* classify */
.crow{display:flex;align-items:center;gap:.7rem;padding:.42rem 0;border-bottom:1px dashed var(--line)}
.crow:last-child{border-bottom:0}
.crow.stack{flex-wrap:wrap}.crow.stack .clabel{flex-basis:100%}
.clabel{flex:1;min-width:6.5rem}
.clabel.chem{font-size:1.16rem}
.segs{display:inline-flex;flex-wrap:wrap;gap:.3rem}
.seg{position:relative}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:block;padding:.36rem .72rem;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:.88rem;font-weight:600;color:var(--muted);transition:background .12s,color .12s,border-color .12s}
.seg:hover span{border-color:var(--ink);color:var(--ink)}
.seg input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--aq);outline-offset:2px}
.crow.no{background:linear-gradient(90deg,transparent,var(--bad-soft))}

/* multiple choice */
.opt{display:flex;gap:.65rem;align-items:flex-start;border:1.5px solid var(--line);border-radius:8px;padding:.6rem .75rem;margin-bottom:.4rem;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--ink)}
.opt input{margin:.3rem 0 0;accent-color:var(--ink);width:1rem;height:1rem;flex:none}
.opt-txt{flex:1}
.opt:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft);box-shadow:none}
.opt.no{border-color:var(--bad);background:var(--bad-soft);box-shadow:none}

/* chips (multi select) */
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{position:relative;display:inline-flex;align-items:center;gap:.25rem;border:1.5px solid var(--line);border-radius:8px;background:#fff;padding:.42rem .7rem;cursor:pointer;font-size:1.08rem}
.chip input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip:has(input:checked){background:var(--ink);border-color:var(--ink);color:#fff}
.chip:has(input:focus-visible){outline:3px solid var(--aq);outline-offset:2px}
.chip .mark{min-width:0}
.chip.no{background:var(--bad-soft)!important;border-color:var(--bad)!important;color:var(--ink)!important}
.chip.ok .mark::before{color:#9ff0c0}

/* numeric */
.nrow{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;padding:.45rem 0;border-bottom:1px dashed var(--line)}
.nrow:last-child{border-bottom:0}
.nlabel{flex:1;min-width:12rem}
.nfield{display:inline-flex;align-items:center;gap:.4rem}
.numin,.sel{border:1.5px solid #9aa3ae;border-radius:7px;background:#fff;padding:.42rem .55rem;width:8.2rem;font-family:var(--mono);font-size:.98rem}
.sel{width:auto;font-family:var(--sans)}
.unit{color:var(--muted);font-weight:600;min-width:1.6rem}
.nrow.ok .numin,.nrow.ok .sel{border-color:var(--good);background:var(--good-soft)}
.nrow.no .numin,.nrow.no .sel{border-color:var(--bad);background:var(--bad-soft)}

/* fill-in equations */
.eq-line{margin:.55rem 0}
.eq-label{font:650 .74rem var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.15rem}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:.15rem .1rem;font-size:1.22rem;white-space:normal}
.eq>span{white-space:pre}
.coef{width:2.3rem;text-align:center;border:1.5px solid #9aa3ae;border-radius:6px;padding:.25rem 0;font:600 1.05rem var(--mono);background:#fff;margin:0 .15rem 0 .1rem}
.stsel{border:1.5px solid #9aa3ae;border-radius:6px;padding:.22rem .15rem;font:italic .92rem var(--serif);background:#fff;margin:0 .1rem}
.coef.ok,.stsel.ok{border-color:var(--good);background:var(--good-soft)}
.coef.no,.stsel.no{border-color:var(--bad);background:var(--bad-soft)}
.step{border-top:1px dashed var(--line);margin-top:.8rem;padding-top:.7rem}
.step:first-child{border-top:0;margin-top:0;padding-top:0}
.step-h{font-weight:700;margin-bottom:.2rem}.step-h small{font-weight:500;color:var(--muted)}
.ions{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem;margin-top:.5rem;font-size:1.18rem}
.ion{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:.3rem .55rem;font-size:1.12rem}
.ion:hover{border-color:var(--ink)}
.ion[aria-pressed="true"]{text-decoration:line-through;text-decoration-thickness:2px;color:#8a929c;background:var(--line2);border-style:dashed}
.ion.no{border-color:var(--bad);background:var(--bad-soft)}
.ions .sym{color:var(--muted);padding:0 .1rem}
.net{font-family:var(--serif);font-size:1.3rem;background:var(--good-soft);border-radius:8px;padding:.5rem .8rem;display:inline-block;margin-top:.3rem}

/* labs */
.lab{display:grid;grid-template-columns:1fr minmax(170px,230px);gap:1.1rem;align-items:start}
@media(max-width:640px){.lab{grid-template-columns:1fr}.scene-wrap{max-width:210px;margin:0 auto}}
.pick{margin-bottom:.65rem}
.pick-label{font:650 .72rem var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.pbtns{display:flex;flex-wrap:wrap;gap:.35rem}
.pbtn{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:.38rem .65rem;font-size:1rem}
.pbtn:hover{border-color:var(--ink)}
.pbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pbtn.plain{font-size:.9rem;font-weight:600}
.result{margin-top:.7rem;border-radius:8px;padding:.6rem .8rem;background:var(--line2);font-size:.95rem;min-height:3rem}
.result.good{background:var(--good-soft)}.result.bad{background:var(--bad-soft)}
.result p{margin:.2rem 0}
.scene{display:block;width:100%;height:auto}
.scene [data-r]{transition:opacity .9s ease,fill .9s ease}
.scene [data-r="dep"]{transition:opacity .9s ease}
.scene-cap{text-align:center;font-size:.82rem;color:var(--muted);margin-top:.2rem}
.labfoot{margin-top:.8rem;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-size:.86rem}
.meter{font-weight:700;margin-right:.3rem}
.logchip{border-radius:999px;padding:.12rem .55rem;background:var(--line2);font-size:.82rem}
.logchip.good{background:var(--good-soft);color:var(--good)}.logchip.bad{background:var(--bad-soft);color:var(--bad)}
.bub{animation:rise 1.9s linear infinite;animation-delay:var(--d)}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-56px);opacity:0}}
.pt{animation:bob 3.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes bob{0%,100%{transform:translate(0,0)}33%{transform:translate(2.5px,-3px)}66%{transform:translate(-2px,2.5px)}}
.drop.fall{animation:fall .45s ease-in}
@keyframes fall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(58px);opacity:0}}
.flash{animation:flash .9s ease-out}
@keyframes flash{0%{fill:#f39cc9}100%{fill:#eaf4f8}}
@media(prefers-reduced-motion:reduce){.bub,.pt,.drop.fall,.flash{animation:none}.scene [data-r]{transition:none}}

/* explorers */
.explore{border-style:dashed;background:#fffdf7}
.readout{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
.ro{border:1px solid var(--line);border-radius:8px;padding:.35rem .65rem;background:#fff;min-width:7rem}
.ro b{display:block;font:650 .68rem var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ro span{font:600 1.08rem var(--mono)}
.ro.keep{border-color:var(--good);background:var(--good-soft)}
input[type=range]{width:100%;accent-color:var(--ink);margin:.4rem 0}
.phbar{height:14px;border-radius:7px;background:linear-gradient(90deg,#d7263d 0%,#f46036 14%,#f6ae2d 28%,#c5d86d 42%,#4caf50 50%,#2e9cca 64%,#3b4cc0 80%,#5b2a86 100%)}
.phticks{display:flex;justify-content:space-between;font:500 .7rem var(--mono);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.86rem;color:var(--muted);margin-top:.3rem}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;margin-right:.3rem;vertical-align:-.08rem}
.legend i.cap{width:1.4rem;border-radius:.4rem}
.widget{border:1px solid var(--line);border-radius:8px;padding:.75rem .85rem;background:#fffdf7;margin-bottom:.9rem}
.widget .lab{grid-template-columns:1fr 150px;align-items:center}
@media(max-width:640px){.widget .lab{grid-template-columns:1fr}.widget .scene-wrap{max-width:150px}}
.widget-h{font:650 .7rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem}

/* reference dialog */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(54rem,94vw);max-height:90vh;color:var(--ink)}
dialog::backdrop{background:rgba(25,34,46,.5)}
.ref-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid var(--line);padding:.7rem 1rem;z-index:1}
.ref-head h2{font:600 1.2rem var(--serif);margin:0}
.ref-body{padding:1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:1rem}
.ref-card{border:1px solid var(--line);border-radius:8px;padding:.7rem .85rem}
.ref-card.wide{grid-column:1/-1}
.ref-card h3{font:700 .74rem var(--sans);letter-spacing:.08em;text-transform:uppercase;margin:0 0 .4rem;color:var(--aq)}
.ref-card ul,.ref-card ol{margin:.2rem 0;padding-left:1.15rem}.ref-card li{margin:.18rem 0}
.ref-card p{margin:.3rem 0}
.series{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center}
.series span{border:1px solid var(--line);border-radius:6px;padding:.1rem .4rem;font-family:var(--serif)}
.series span.h{background:var(--ink);color:#fff;border-color:var(--ink)}
.series em{font-size:.8rem;color:var(--muted);font-style:normal;font-weight:600}
table.grid{border-collapse:collapse;font-size:.9rem;margin:.3rem 0}
table.grid th,table.grid td{border:1px solid rgba(0,0,0,.18);padding:.22rem .5rem;text-align:center}
table.grid th{background:rgba(255,255,255,.6);font-weight:650}

/* summary */
.sum-top{display:flex;gap:1.2rem;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:1rem}
.score{font:600 3.2rem/1 var(--serif)}.score small{font-size:1.3rem;color:var(--muted)}
.sum-meta{flex:1;min-width:14rem}
.sum-meta label{font:650 .72rem var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block}
.sum-meta input{border:1.5px solid #9aa3ae;border-radius:7px;padding:.4rem .55rem;width:100%;max-width:20rem}
table.sum{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:.94rem}
table.sum th,table.sum td{padding:.42rem .7rem;border-bottom:1px solid var(--line2);text-align:left}
table.sum th{font:650 .7rem var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:#faf9f4}
table.sum tr.ph td{background:#faf9f4;font-weight:700}
table.sum td.n{font-family:var(--mono);white-space:nowrap}
@media print{
  body{background:#fff}.bar,.brand,.part-nav,.no-print,dialog{display:none!important}
  .panel{display:none!important}#panel-sum{display:block!important;padding:0}
}
</style>

/* F: plain formula text → HTML.  Fe(OH)3(s), SO4^2-, ->, <=>  */
const F1 = s => s
  .replace(/<=>/g, '⇌').replace(/->/g, '→')
  .replace(/\^(\d*)([+-])/g, (m, n, sg) => '<sup>' + n + (sg === '-' ? '−' : '+') + '</sup>')
  .replace(/([A-Za-z)])(\d+)/g, '$1<sub>$2</sub>')
  .replace(/\((aq|s|l|g)\)/g, '<span class="st">($1)</span>');
/* each species stays on one line; long equations may wrap between species */
const F = s => String(s).split(' ').map(t => t ? '<span class="nw">' + F1(t) + '</span>' : '').join(' ');
/* P: prose with [[formula]] segments */
const P = s => String(s).replace(/\[\[(.+?)\]\]/g, (m, f) => '<span class="chem">' + F(f) + '</span>');
const strip = s => String(s).replace(/<[^>]+>/g, '').replace(/\[\[|\]\]/g, '').replace(/\^/g, '');
const mark = (el, ok) => { el.classList.remove('ok', 'no'); if (ok != null) el.classList.add(ok ? 'ok' : 'no'); };

function parseNum(raw) {
  let s = String(raw == null ? '' : raw).trim().replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/,/g, '');
  s = s.replace(/[×x*]10\^?\(?([+-]?\d+)\)?/i, 'e$1');
  const m = s.match(/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i);
  return m ? parseFloat(m[0]) : NaN;
}
function parseOx(raw) {
  let s = String(raw == null ? '' : raw).trim().replace(/[−–—]/g, '-').replace(/\s+/g, '');
  const m = s.match(/^(\d+)([+-])$/); if (m) s = m[2] + m[1];
  return /^[+-]?\d+$/.test(s) ? parseInt(s, 10) : NaN;
}
const near = (v, t, tol, abs) => abs != null ? Math.abs(v - t) <= abs + 1e-12 : Math.abs(v - t) <= Math.abs(t) * (tol || 0.015);

const PPT = {AgI: PALE, Ag2CO3: PALE, PbI2: YEL};
function mixEval(ck, ak) {
  const c = CAT[ck], n = AN[ak], g = c.z === n.z ? c.z : 1, sc = n.z / g, sa = c.z / g;
  const prod = c.f + (sc > 1 ? sc : '') + n.f + (sa > 1 ? sa : '');
  const other = n.alk + 'NO3';
  const react = (ak === 'Cl' || ak === 'I') ? (ck === 'Ag' || ck === 'Pb') : ak === 'SO4' ? ck !== 'Mg' : true;
  const label = c.salt + ' + ' + n.salt;
  if (!react) return {react, label, cell: '—',
    html: '<p><b>No reaction.</b> The possible products, [[' + prod + ']] and [[' + other + ']], are both soluble, so all four ions stay in solution as spectators. There is no net ionic equation.</p><p>' + n.rule + '</p>',
    scene: {liquid: CLEAR}, cap: 'Clear solution — no change'};
  const col = PPT[prod] || WHITE;
  const net = (sc > 1 ? sc : '') + c.f + '^' + (c.z > 1 ? c.z : '') + '+(aq) + ' + (sa > 1 ? sa : '') + n.f + '^' + (n.z > 1 ? n.z : '') + '-(aq) -> ' + prod + '(s)';
  return {react, label, cell: prod,
    html: '<p><b>Precipitate: [[' + prod + '(s)]]</b> — ' + col.name + '.</p><p>Net ionic: [[' + net + ']]</p><p>Spectators: [[' + n.alk + '^+]] and [[NO3^-]]. ' + n.rule + '</p>',
    scene: {liquid: CLEAR, sed: col}, cap: col.name.charAt(0).toUpperCase() + col.name.slice(1) + ' solid settles out'};
}

function dipEval(mk, sk) {
  const so = SOLN[sk], me = METAL[mk], label = mk + ' in ' + so.salt;
  if (mk === sk) return {skip: 'That solution already contains ions of the same metal — there is nothing to displace. Pick a different pair.'};
  const react = SERIES.indexOf(mk) < SERIES.indexOf(sk);
  const ion = sk === 'H' ? 'H^+' : sk + '^' + (so.z > 1 ? so.z : '') + '+';
  const base = {liquid: so.liq, metal: me.col};
  if (!react) return {react, label, cell: '—',
    html: '<p><b>No reaction.</b> ' + mk + ' is <em>below</em> ' + (sk === 'H' ? 'hydrogen' : sk) + ' in the activity series, so [[' + ion + ']] cannot oxidize ' + mk + '(s).</p>',
    scene: base, cap: 'Nothing happens'};
  const net = sk === 'H' ? mk + '(s) + 2H^+(aq) -> ' + mk + '^2+(aq) + H2(g)'
    : so.z === 2 ? mk + '(s) + ' + sk + '^2+(aq) -> ' + mk + '^2+(aq) + ' + sk + '(s)'
    : mk + '(s) + 2' + sk + '^+(aq) -> ' + mk + '^2+(aq) + 2' + sk + '(s)';
  const extra = me.ion === BLUE ? ', and the solution turns blue as [[Cu^2+]] forms' : (me.ion === GREEN && sk !== 'Fe') ? ', and the solution turns pale green as [[Fe^2+]] forms' : '';
  return {react, label, cell: 'reacts',
    html: '<p><b>Reaction.</b> ' + mk + ' is <em>above</em> ' + (sk === 'H' ? 'hydrogen' : sk) + ' in the activity series.</p><p>Net ionic: [[' + net + ']]</p><p>Oxidized: ' + mk + ' (0 → +2). Reduced: ' + (sk === 'H' ? 'H' : sk) + ' (+' + so.z + ' → 0). You would see ' + so.see + extra + '.</p>',
    scene: Object.assign({}, base, {liquid: me.ion, dep: so.dep, bubbles: sk === 'H'}), cap: sk === 'H' ? 'Gas bubbles form' : 'A new metal plates out'};
}
function gridTable(rows, cols, rl, cl, fn) {
  return '<table class="grid"><tr><th></th>' + cols.map(c => '<th>' + F(cl(c)) + '</th>').join('') + '</tr>' +
    rows.map(r => '<tr><th>' + F(rl(r)) + '</th>' + cols.map(c => { const e = fn(r, c); return '<td>' + (e.skip ? '' : F(e.cell)) + '</td>'; }).join('') + '</tr>').join('') + '</table>';
}

    {id: '4.1', type: 'num', title: 'Assign oxidation numbers', prompt: 'Give the oxidation number of the highlighted element. Include the sign (for example, +4 or −2).',
     hint: 'Assign the reliable elements first (Group 1A = +1, H = +1, O = −2), then solve for the unknown so that everything sums to the overall charge.',
     sol: '<ul><li>[[K2Cr2O7]]: 2(+1) + 2x + 7(−2) = 0 → x = <b>+6</b></li><li>[[SO3^2-]]: x + 3(−2) = −2 → x = <b>+4</b></li><li>[[NH4^+]]: x + 4(+1) = +1 → x = <b>−3</b></li><li>[[H2O2]]: 2(+1) + 2x = 0 → x = <b>−1</b> (H outranks O, so O is not −2 in a peroxide)</li><li>[[ClO4^-]]: x + 4(−2) = −1 → x = <b>+7</b></li></ul>',
     parts: [
      {tag: 'a', l: '(a) <b>Cr</b> in [[K2Cr2O7]]', ans: 6, abs: 0, ox: 1, traps: [{v: 12, msg: 'That is the total for both Cr atoms — divide by 2.'}, {v: -6, msg: 'Right size, wrong sign.'}]},
      {tag: 'b', l: '(b) <b>S</b> in [[SO3^2-]]', ans: 4, abs: 0, ox: 1, traps: [{v: 6, msg: 'The numbers must sum to the ion’s charge, −2, not to zero.'}]},
      {tag: 'c', l: '(c) <b>N</b> in [[NH4^+]]', ans: -3, abs: 0, ox: 1, traps: [{v: 3, msg: 'Right size, wrong sign: x + 4(+1) = +1.'}, {v: -4, msg: 'The numbers must sum to +1, the charge on the ion.'}]},
      {tag: 'd', l: '(d) <b>O</b> in [[H2O2]]', ans: -1, abs: 0, ox: 1, traps: [{v: -2, msg: 'That is oxygen’s usual value, but H (+1) has priority: 2(+1) + 2x = 0.'}]},
      {tag: 'e', l: '(e) <b>Cl</b> in [[ClO4^-]]', ans: 7, abs: 0, ox: 1, traps: [{v: 8, msg: 'The numbers must sum to −1, not zero.'}, {v: -1, msg: 'Chlorine is only −1 when nothing higher on the priority list (here, O) forces it to be something else.'}]}]},
    {id: '4.2', type: 'classify', title: 'Who is oxidized? Who is the agent?', prompt: 'Magnesium ribbon is dropped into hydrochloric acid: [[Mg(s) + 2HCl(aq) -> MgCl2(aq) + H2(g)]]',

    {id: '4.3', type: 'predictlab', lab: 'dip', title: 'Activity series: will the metal react?',

    {id: '4.4', type: 'fill', title: 'Balance with half-reactions', prompt: 'Aluminum metal is placed in a solution containing [[Cu^2+]]. The electrons lost must equal the electrons gained.',

{ n: 5, title: 'Concentration and pH', short: 'Concentration', min: 12, hue: '#3b4cc0',

let uid = 0;
function makeScene(withStrip) {
  const id = 'clip' + (++uid);
  let dots = '', bub = '';
  for (let i = 0; i < 30; i++) dots += '<circle cx="' + (91 + (i * 37) % 19) + '" cy="' + (85 + (i * 53) % 59) + '" r="' + (2.2 + i % 3) + '"/>';
  for (let i = 0; i < 7; i++) bub += '<circle class="bub" style="--d:' + (-i * 0.27).toFixed(2) + 's" cx="' + (82 + (i * 11) % 37) + '" cy="140" r="' + (2 + i % 2) + '"/>';
  const wrap = h('div', {class: 'scene-wrap', html:
    '<svg viewBox="26 0 148 182" class="scene" role="img" aria-label="Beaker">' +
    '<defs><clipPath id="' + id + '"><path d="M43 46V160Q43 173 56 173H144Q157 173 157 160V46Z"/></clipPath></defs>' +
    (withStrip ? '<rect data-r="metal" x="90" y="8" width="20" height="138" rx="2" fill="#c8cdd4" stroke="rgba(0,0,0,.4)"/>' : '') +
    '<g clip-path="url(#' + id + ')">' +
    '<rect data-r="liquid" x="40" y="80" width="120" height="96" fill="' + CLEAR + '" opacity="' + (withStrip ? '.62' : '.9') + '"/>' +
    '<rect data-r="cloud" x="40" y="80" width="120" height="96" fill="#fff" opacity="0"/>' +
    '<path data-r="sed" d="M40 176V157Q66 141 96 151Q128 139 160 154V176Z" fill="#fff" stroke="#9aa4af" stroke-width="1.5" opacity="0"/></g>' +
    (withStrip ? '<g data-r="dep" opacity="0" stroke="rgba(0,0,0,.25)" stroke-width=".6">' + dots + '</g><g data-r="bubbles" opacity="0" fill="#fff" stroke="#6f9bad">' + bub + '</g>' : '') +
    '<line x1="44" y1="80" x2="156" y2="80" stroke="rgba(11,110,138,.45)" stroke-width="1.5"/>' +
    '<path d="M37 44H47M43 45V160Q43 173 56 173H144Q157 173 157 160V45M153 44H163" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round"/></svg>'});
  const cap = h('div', {class: 'scene-cap'});
  wrap.append(cap);
  const q = r => wrap.querySelector('[data-r="' + r + '"]');
  let timer = null;
  return {node: wrap,
    set(o, text, animate) {
      clearTimeout(timer);
      q('liquid').setAttribute('fill', o.liquid || CLEAR);
      if (q('metal') && o.metal) q('metal').setAttribute('fill', o.metal);
      const sed = q('sed'), cloud = q('cloud');
      if (o.sed) {
        sed.setAttribute('fill', o.sed.fill); sed.setAttribute('stroke', o.sed.stroke); cloud.setAttribute('fill', o.sed.fill);
        if (animate) { cloud.setAttribute('opacity', '.75'); timer = setTimeout(() => { cloud.setAttribute('opacity', '.4'); sed.setAttribute('opacity', '1'); }, 700); }
        else { cloud.setAttribute('opacity', '.4'); sed.setAttribute('opacity', '1'); }
      } else { sed.setAttribute('opacity', '0'); cloud.setAttribute('opacity', '0'); }
      if (q('dep')) { if (o.dep) q('dep').setAttribute('fill', o.dep); q('dep').setAttribute('opacity', o.dep ? '1' : '0'); q('bubbles').setAttribute('opacity', o.bubbles ? '1' : '0'); }
      cap.textContent = text || '';
    }};
}

function makeFill(lines) {
  const fields = [];
  const node = h('div', {class: 'fill'}, lines.map((ln, li) => {
    const eq = h('div', {class: 'eq chem'});
    ln.t.split(/(\{[^}]+\})/).forEach(tok => {
      const m = /^\{(?:(e|st):)?([^}]+)\}$/.exec(tok);
      if (!m) { if (tok) eq.append(h('span', {html: F(tok)})); return; }
      let el;
      if (m[1] === 'st') {
        el = h('select', {class: 'stsel', 'aria-label': 'physical state'}, h('option', {value: ''}, '( ? )'), ['aq', 's', 'l', 'g'].map(s => h('option', {value: s}, '(' + s + ')')));
        fields.push({el, kind: 'st', a: m[2], li});
      } else {
        el = h('input', {class: 'coef', type: 'text', inputmode: 'numeric', maxlength: '2', autocomplete: 'off', 'aria-label': m[1] ? 'number of electrons' : 'coefficient'});
        fields.push({el, kind: m[1] ? 'num' : 'coef', a: +m[2], li});
      }
      el.addEventListener('input', () => mark(el));
      eq.append(el);
    });
    return h('div', {class: 'eq-line'}, ln.l ? h('div', {class: 'eq-label', html: P(ln.l)}) : null, eq);
  }));
  const read = f => { const v = f.el.value.trim(); if (f.kind === 'st') return v; if (v === '') return f.kind === 'coef' ? 1 : NaN; return /^\d+$/.test(v) ? +v : NaN; };
  return {node, fields,
    get: () => fields.map(f => f.el.value),
    set: v => fields.forEach((f, i) => { if (v && v[i] != null) f.el.value = v[i]; }),
    lock: () => fields.forEach(f => { f.el.disabled = true; }),
    check() {
      if (fields.every(f => f.el.value.trim() === '')) return {incomplete: true, msg: 'Fill in the blanks first.'};
      if (fields.some(f => f.kind !== 'coef' && f.el.value.trim() === '')) return {incomplete: true, msg: 'Fill in every box. (A coefficient left blank counts as 1.)'};
      let wrong = 0, multiple = false;
      const by = {};
      fields.forEach(f => (by[f.li] = by[f.li] || []).push(f));
      Object.keys(by).forEach(k => {
        const cs = by[k].filter(f => f.kind === 'coef');
        if (cs.length > 1) { const r = read(cs[0]) / cs[0].a; if (r > 1 && Number.isInteger(r) && cs.every(f => read(f) === f.a * r)) multiple = true; }
      });
      fields.forEach(f => { const ok = read(f) === f.a; mark(f.el, ok); if (!ok) wrong++; });
      if (!wrong) return {ok: true, msg: 'Balanced — atoms and charge both check out.'};
      if (multiple) return {ok: false, msg: 'The atoms balance, but use the <em>smallest</em> whole-number coefficients.'};
      return {ok: false, msg: wrong + (wrong === 1 ? ' box needs' : ' boxes need') + ' another look (outlined in red).'};
    }};
}

      const s = score();
      foot.textContent = '';
      foot.append(h('span', {class: 'meter'}, 'Correct predictions: ' + Math.min(s.right, 4) + ' / 4'), h('span', {class: 'logchip ' + (s.none ? 'good' : '')}, s.none ? '✓ no-reaction pair found' : 'still needed: a no-reaction pair'));
      log.forEach(x => foot.append(h('span', {class: 'logchip ' + (x.ok ? 'good' : 'bad'), html: (x.ok ? '✓ ' : '✗ ') + F(x.label)})));
    }
    function run() {
      const ev = cfg.eval(pick[0], pick[1]);
      if (ev.skip) { result.className = 'result'; result.innerHTML = '<p>' + ev.skip + '</p>'; return; }
      const key = pick[0] + '|' + pick[1], ok = (pred === 1) === ev.react;
      scene.set(ev.scene, ev.cap, true);
      const seen = log.some(x => x.key === key);
      if (!seen) { log.push({key, ok, react: ev.react, label: ev.label}); api.touch(); }
      result.className = 'result ' + (ok ? 'good' : 'bad');
      result.innerHTML = '<p><b>' + (ok ? '✓ Your prediction was right.' : '✗ Not what you predicted.') + '</b>' + (seen ? ' <span style="color:var(--muted)">(You already tested this pair, so it does not count again.)</span>' : '') + '</p>' + P(ev.html);
      drawFoot();
      const s = score();
      if (s.right >= 4 && s.none) api.done('Bench complete: 4 correct predictions, including a no-reaction pair.');
      pred = null; gp.clear(); goBtn.disabled = true;
    }
    idle(); drawFoot();
    const body = h('div', null, h('div', {class: 'lab'}, h('div', null, g[0].node, g[1].node, gp.node, goBtn, result), scene.node), foot);
    return {body, get: () => log, set: v => { if (Array.isArray(v)) { log = v; drawFoot(); } }, sol: cfg.sol};
  },

  titration(act) {
    const VEQ = 2190; let v = 0;           // hundredths of a mL
    let ticks = '';
    for (let t = 0; t <= 50; t += 5) ticks += '<path d="M127 ' + (20 + 3.5 * t) + 'h' + (t % 10 ? 4 : 7) + '" stroke="#4b5563"/>' + (t % 10 ? '' : '<text x="137" y="' + (23 + 3.5 * t) + '" font-size="8" fill="#566170">' + t + '</text>');
    const fig = h('div', {class: 'scene-wrap', html:
      '<svg viewBox="14 0 176 326" class="scene" role="img" aria-label="Buret of sodium hydroxide above a flask of acid">' +
      '<defs><clipPath id="flaskclip"><path d="M108 226V250L67 302Q62 310 72 310H168Q178 310 173 302L132 250V226Z"/></clipPath></defs>' +
      '<rect x="22" y="314" width="160" height="7" rx="2" fill="#8d96a3"/><rect x="38" y="8" width="6" height="308" fill="#8d96a3"/><rect x="42" y="64" width="72" height="6" fill="#8d96a3"/><rect x="62" y="311" width="116" height="4" fill="#fff" stroke="#c9ced6"/>' +
      '<rect x="113" y="12" width="14" height="184" fill="#fff" stroke="#4b5563" stroke-width="1.5"/><rect data-r="blq" x="114.2" y="20" width="11.6" height="175" fill="#a9d3e6"/>' + ticks +
      '<path d="M116 196L118.4 216H121.6L124 196Z" fill="#fff" stroke="#4b5563" stroke-width="1.5"/><rect x="105" y="200" width="30" height="5" rx="2" fill="#19222e"/>' +
      '<circle class="drop" data-r="drop" cx="120" cy="220" r="2.8" fill="#6fb3d1" opacity="0"/>' +
      '<g clip-path="url(#flaskclip)"><rect data-r="flq" x="56" y="278" width="128" height="36" fill="#eaf4f8"/></g>' +
      '<path d="M108 226V250L67 302Q62 310 72 310H168Q178 310 173 302L132 250V226" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>'});
    const q = r => fig.querySelector('[data-r="' + r + '"]');
    const rV = h('span', null, '0.00 mL'), status = h('div', {class: 'result', 'aria-live': 'polite'});
    const addBtns = [[500, '+ 5 mL'], [100, '+ 1 mL'], [10, '+ 0.1 mL']].map(([d, t]) => h('button', {type: 'button', class: 'pbtn plain', onclick: () => add(d)}, t));
    const draw = (animate) => {
      const mL = v / 100, over = v - VEQ;
      q('blq').setAttribute('y', 20 + 3.5 * mL); q('blq').setAttribute('height', Math.max(0, 175 - 3.5 * mL));
      const flq = q('flq'); flq.classList.remove('flash');
      let fill = '#eaf4f8', msg, cls = 'result';
      if (v === 0) msg = 'Buret filled to 0.00 mL with 0.1000 M NaOH. The acid in the flask is colorless.';
      else if (over < -150) msg = 'Still colorless. Keep adding.';
      else if (over < 0) { msg = 'A pink flash appears where the base lands, then fades as you swirl. <b>You are close — switch to 0.1 mL.</b>'; if (animate) { void flq.getBoundingClientRect(); flq.classList.add('flash'); } }
      else if (over <= 20) { fill = '#f9cfe3'; cls = 'result good'; msg = '<b>Faint pink that stays.</b> This is the endpoint — read the buret and do the calculation below.'; }
      else { fill = over > 150 ? '#d6337f' : '#ea6fa8'; cls = 'result bad'; msg = '<b>Dark pink: you overshot the endpoint.</b> Refill the buret and approach it in 0.1 mL portions.'; }
      flq.setAttribute('fill', fill);
      rV.textContent = mL.toFixed(2) + ' mL'; status.className = cls; status.innerHTML = '<p>' + msg + '</p>';
      addBtns.forEach((b, i) => { b.disabled = v + [500, 100, 10][i] > 5000; });
    };
    function add(d) {
      v += d;
      const drop = q('drop'); drop.classList.remove('fall'); void drop.getBoundingClientRect(); drop.classList.add('fall');
      draw(true);
    }
    const inV = h('input', {class: 'numin', id: 'tv', type: 'text', inputmode: 'decimal', autocomplete: 'off'});
    const inM = h('input', {class: 'numin', id: 'tm', type: 'text', inputmode: 'decimal', autocomplete: 'off'});
    const rowV = h('div', {class: 'nrow'}, h('label', {class: 'nlabel', for: 'tv'}, 'Volume of NaOH delivered at the endpoint'), h('span', {class: 'nfield'}, inV, h('span', {class: 'unit'}, 'mL'), h('span', {class: 'mark'})));
    const rowM = h('div', {class: 'nrow'}, h('label', {class: 'nlabel', for: 'tm'}, 'Concentration of the HCl solution'), h('span', {class: 'nfield'}, inM, h('span', {class: 'unit'}, 'M'), h('span', {class: 'mark'})));
    inV.addEventListener('input', () => mark(rowV)); inM.addEventListener('input', () => mark(rowM));
    draw();
    const body = h('div', null, h('div', {class: 'lab'},
      h('div', null, h('div', {class: 'pick'}, h('div', {class: 'pick-label'}, 'Add NaOH from the buret'), h('div', {class: 'pbtns'}, addBtns, h('button', {type: 'button', class: 'pbtn plain', onclick: () => { v = 0; draw(); }}, 'Refill & restart'))),
        h('div', {class: 'readout'}, h('div', {class: 'ro'}, h('b', null, 'Buret reading'), rV)), status, h('div', {style: 'margin-top:.8rem'}, rowV, rowM)), fig));
    return {body,
      get: () => ({v, a: inV.value, m: inM.value}), set(s) { if (!s) return; v = s.v || 0; inV.value = s.a || ''; inM.value = s.m || ''; draw(); },
      check() {
        if (v === 0) return {incomplete: true, msg: 'Run the titration first: add NaOH until the flask turns faint pink.'};
        const a = parseNum(inV.value), m = parseNum(inM.value);
        if (isNaN(a) || isNaN(m)) return {incomplete: true, msg: 'Enter both the endpoint volume and the concentration.'};
        const aok = a >= 21.85 && a <= 22.15, mok = near(m, 0.0876, 0.013);
        mark(rowV, aok); mark(rowM, aok && mok);
        if (aok && mok) return {ok: true, msg: 'Correct: 0.1000 M × ' + a.toFixed(2) + ' mL ÷ 25.00 mL ≈ 0.088 M HCl.'};
        const out = [];
        if (!aok) out.push(a > 22.15 ? 'That volume is past the endpoint (the flask is dark pink there). Refill and stop at the <em>first</em> faint pink that stays.' : a < 1 ? 'Enter the endpoint volume in mL, as read from the buret.' : 'At that volume the flask is still colorless — the endpoint comes later.');
        else if (near(m, 0.1142, 0.02)) out.push('You swapped the volumes. mmol NaOH = 0.1000 M × (mL of NaOH); then divide by the 25.00 mL of acid.');
        else if (near(m, 2.19, 0.02) || near(m, 0.00219, 0.02)) out.push('That is the amount of NaOH (and of HCl). Divide by the volume of acid, 25.00 mL, to get molarity.');
        else out.push('The volume is right. Now: mmol NaOH = M × mL, which equals mmol HCl; divide by 25.00 mL.');
        return {ok: false, msg: out.join('<br>')};
      },
      sol: () => P(act.sol)};
  }
};

/* ───────── build the page ───────── */
const main = $('#main'), tabsEl = $('#tabs');
const ACTS = [];          // graded activities
let tabBtns = [];
const STATUS = {'': 'To do', tried: 'In progress', correct: '✓ Correct', revealed: 'Solution viewed'};
const getSt = id => S.st[id] || (S.st[id] = {s: '', n: 0});

function buildAct(part, act) {
  const graded = act.type !== 'explore', st = graded ? getSt(act.id) : null;
  const card = h('section', {class: 'act' + (graded ? '' : ' explore'), id: 'act-' + act.id, 'aria-labelledby': 'h-' + act.id});
  const status = graded ? h('span', {class: 'status'}) : null;
  const fb = h('div', {class: 'fb', role: 'status', hidden: true});
  const hintBox = h('div', {class: 'hintbox', hidden: true}), solBox = h('div', {class: 'solbox', hidden: true});
  const paint = () => { if (!graded) return; status.textContent = STATUS[st.s]; status.className = 'status s-' + (st.s || 'todo'); refreshTabs(); };
  const say = (kind, html) => { fb.hidden = false; fb.className = 'fb ' + kind; fb.innerHTML = html; };
  let solBtn = null;
  const unlock = () => { if (solBtn) { solBtn.disabled = false; solBtn.title = ''; } };
  const api = {
    touch() { if (st.s !== 'correct' && st.s !== 'revealed') { st.n++; if (!st.s) st.s = 'tried'; } unlock(); paint(); persist(); },
    done(msg) { if (st.s !== 'revealed') st.s = 'correct'; say('good', msg); unlock(); paint(); persist(); }
  };
  const ctl = TYPES[act.type](act, api);
  const persist = () => { if (ctl.get) S.v[act.id] = ctl.get(); save(); };
  card.append(h('div', {class: 'act-head'},
    graded ? h('span', {class: 'act-num'}, act.id) : h('span', {class: 'tag'}, 'Explore'),
    h('h3', {id: 'h-' + act.id}, act.title), act.bonus ? h('span', {class: 'tag'}, 'Bonus · if time') : null, status));
  const prompt = h('div', {class: 'prompt', html: P(act.prompt)});
  if (act.widget && graded) card.append(WIDGETS[act.widget](), prompt);
  else { card.append(prompt); if (act.widget) card.append(WIDGETS[act.widget]()); }
  if (ctl.body) card.append(ctl.body);
  if (graded) {
    ACTS.push({part, act});
    const actions = h('div', {class: 'actions'});
    if (ctl.check) actions.append(h('button', {type: 'button', class: 'btn', onclick: () => {
      const r = ctl.check();
      if (r.incomplete) { say('note', r.msg); return; }
      if (r.partial) { say('good', r.msg); persist(); return; }
      if (st.s !== 'correct' && st.s !== 'revealed') st.n++;
      if (r.ok) { if (st.s !== 'revealed') st.s = 'correct'; say('good', '<b>✓</b> ' + r.msg); }
      else { if (!st.s) st.s = 'tried'; say('bad', '<b>✗</b> ' + r.msg); }
      unlock(); paint(); persist();
    }}, 'Check'));
    if (act.hint) actions.append(h('button', {type: 'button', class: 'btn ghost', 'aria-expanded': 'false', onclick: e => {
      hintBox.hidden = !hintBox.hidden; e.currentTarget.setAttribute('aria-expanded', String(!hintBox.hidden));
      if (!hintBox.innerHTML) hintBox.innerHTML = '<h4>Hint</h4>' + P(act.hint);
    }}, 'Hint'));
    solBtn = h('button', {type: 'button', class: 'btn ghost', 'aria-expanded': 'false', onclick: e => {
      solBox.hidden = !solBox.hidden; e.currentTarget.setAttribute('aria-expanded', String(!solBox.hidden));
      if (!solBox.innerHTML) solBox.innerHTML = '<h4>Worked solution</h4>' + ctl.sol();
      if (!solBox.hidden && st.s !== 'correct' && st.s !== 'revealed') { st.s = 'revealed'; paint(); save(); }
    }}, 'Show solution');
    if (!KEYED && !st.s) { solBtn.disabled = true; solBtn.title = 'Try it once first'; }
    actions.append(solBtn);
    card.append(actions, fb, hintBox, solBox);
    if (ctl.set && S.v[act.id] != null) { try { ctl.set(S.v[act.id]); } catch (e) {} }
    card.addEventListener('change', persist);
    paint();
  }
  return card;
}

const panels = [];
PARTS.forEach((p, i) => {
  const panel = h('div', {class: 'panel', id: 'panel-' + i, role: 'tabpanel', 'aria-labelledby': 'tab-' + i, style: '--hue:' + p.hue, hidden: true});
  panel.append(h('div', {class: 'part-head'}, h('div', {class: 'pn', 'aria-hidden': 'true'}, String(p.n)),
    h('div', null, h('h2', {tabindex: '-1'}, 'Part ' + p.n + ' · ' + p.title), h('p', {class: 'lead', html: P(p.lead)})),
    h('div', {class: 'pmin'}, 'about ' + p.min + ' min')));
  p.acts.forEach(a => panel.append(buildAct(p, a)));
  const nav = h('div', {class: 'part-nav'});
  nav.append(i > 0 ? h('button', {type: 'button', class: 'btn ghost', onclick: () => show(i - 1)}, '← Part ' + i) : h('span'));
  nav.append(h('button', {type: 'button', class: 'btn', onclick: () => show(i + 1)}, i < PARTS.length - 1 ? 'Part ' + (i + 2) + ': ' + PARTS[i + 1].short + ' →' : 'See your summary →'));
  panel.append(nav);
  main.append(panel); panels.push(panel);
  tabsEl.append(h('button', {type: 'button', class: 'tab', role: 'tab', id: 'tab-' + i, 'aria-controls': 'panel-' + i, onclick: () => show(i)},
    h('span', {class: 'tn'}, String(p.n)), h('span', {class: 'tt'}, p.short), h('span', {class: 'tc'})));
});

/* summary panel */
const sumBody = h('div');
const sumPanel = h('div', {class: 'panel', id: 'panel-sum', role: 'tabpanel', 'aria-labelledby': 'tab-sum', hidden: true},
  h('div', {class: 'part-head', style: '--hue:var(--ink)'}, h('div', {class: 'pn', 'aria-hidden': 'true'}, 'Σ'),
    h('div', null, h('h2', {tabindex: '-1'}, 'Your summary'), h('p', {class: 'lead'}, 'A record of what you completed today. Print it or save it as a PDF if your instructor asks you to submit it on Canvas.')), h('div', {class: 'pmin'})),
  sumBody);
main.append(sumPanel); panels.push(sumPanel);
tabsEl.append(h('button', {type: 'button', class: 'tab', role: 'tab', id: 'tab-sum', 'aria-controls': 'panel-sum', onclick: () => show(PARTS.length)}, h('span', {class: 'tn'}, 'Σ'), h('span', {class: 'tt'}, 'Summary')));
tabBtns = Array.from(tabsEl.children);

function refreshTabs() {
  PARTS.forEach((p, i) => {
    const g = p.acts.filter(a => a.type !== 'explore' && !a.bonus), done = g.filter(a => { const s = (S.st[a.id] || {}).s; return s === 'correct' || s === 'revealed'; }).length;
    if (!tabBtns[i]) return;
    tabBtns[i].querySelector('.tc').textContent = done + '/' + g.length;
    tabBtns[i].classList.toggle('done', done === g.length);
  });
}
function renderSummary() {
  let core = 0, coreOk = 0, bonus = 0, bonusOk = 0;
  const tb = h('tbody');
  PARTS.forEach(p => {
    tb.append(h('tr', {class: 'ph'}, h('td', {colspan: '4'}, 'Part ' + p.n + ' · ' + p.title)));
    p.acts.forEach(a => {
      if (a.type === 'explore') return;
      const st = S.st[a.id] || {s: '', n: 0};
      if (a.bonus) { bonus++; if (st.s === 'correct') bonusOk++; } else { core++; if (st.s === 'correct') coreOk++; }
      tb.append(h('tr', null, h('td', {class: 'n'}, a.id), h('td', null, a.title + (a.bonus ? ' (bonus)' : '')),
        h('td', null, h('span', {class: 'status s-' + (st.s || 'todo')}, st.s ? STATUS[st.s] : 'Not attempted')), h('td', {class: 'n'}, st.n ? String(st.n) : '—')));
    });
  });
  const name = h('input', {type: 'text', id: 'stuName', value: S.name || '', autocomplete: 'name', oninput: e => { S.name = e.target.value; save(); }});
  let armed = false;
  const reset = h('button', {type: 'button', class: 'btn ghost small', onclick: () => {
    if (!armed) { armed = true; reset.textContent = 'Click again to erase all answers'; setTimeout(() => { armed = false; reset.textContent = 'Start over'; }, 4000); return; }
    try { localStorage.removeItem(KEY); } catch (e) {} location.reload();
  }}, 'Start over');
  sumBody.textContent = '';
  sumBody.append(
    h('div', {class: 'sum-top'}, h('div', {class: 'score', html: coreOk + '<small> / ' + core + ' correct</small>'}),
      h('div', {class: 'sum-meta'}, h('label', {for: 'stuName'}, 'Name'), name,
        h('div', {style: 'margin-top:.4rem;color:var(--muted);font-size:.9rem'}, 'Bonus: ' + bonusOk + ' / ' + bonus + ' · ' + new Date().toLocaleString())),
      h('div', {class: 'no-print', style: 'display:flex;gap:.4rem;flex-wrap:wrap'}, h('button', {type: 'button', class: 'btn', onclick: () => window.print()}, 'Print / save as PDF'), reset)),
    h('table', {class: 'sum'}, h('thead', null, h('tr', null, h('th', null, '#'), h('th', null, 'Activity'), h('th', null, 'Result'), h('th', null, 'Tries'))), tb));
}
function show(i, quiet) {
  i = Math.max(0, Math.min(panels.length - 1, i));
  panels.forEach((p, j) => { p.hidden = j !== i; });
  tabBtns.forEach((b, j) => { b.setAttribute('aria-selected', j === i ? 'true' : 'false'); b.tabIndex = j === i ? 0 : -1; });
  if (i === PARTS.length) renderSummary();
  S.part = i; save();
  if (!quiet) {
    const bar = $('.bar'); const y = bar.getBoundingClientRect().top + window.scrollY;
    if (window.scrollY > y) window.scrollTo(0, y);
    tabBtns[i].scrollIntoView({block: 'nearest', inline: 'center'});
    const hd = panels[i].querySelector('h2'); if (hd) hd.focus({preventScroll: true});
  }
}
tabsEl.addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const n = (S.part + (e.key === 'ArrowRight' ? 1 : -1) + panels.length) % panels.length;
  show(n, true); tabBtns[n].focus();
});

/* reference tables */
$('#refBody').innerHTML = P(
  '<div class="ref-card"><h3>Strong acids</h3><p>[[HCl]], [[HBr]], [[HI]], [[HNO3]], [[HClO3]], [[HClO4]], [[H2SO4]]</p><p style="color:var(--muted);font-size:.9rem">Only the first ionization of [[H2SO4]] is complete. Every other acid you meet in this course is weak.</p></div>' +
  '<div class="ref-card"><h3>Strong bases</h3><p>Group 1A hydroxides: [[LiOH]], [[NaOH]], [[KOH]], [[RbOH]], [[CsOH]]</p><p>Heavy Group 2A hydroxides: [[Ca(OH)2]], [[Sr(OH)2]], [[Ba(OH)2]]</p></div>' +
  '<div class="ref-card"><h3>Soluble compounds</h3><ul><li>Group 1A cations and [[NH4^+]] — always</li><li>[[NO3^-]], [[C2H3O2^-]], [[ClO3^-]] — always</li><li>[[Cl^-]], [[Br^-]], [[I^-]] — <b>except</b> with [[Ag^+]], [[Hg2^2+]], [[Pb^2+]]</li><li>[[SO4^2-]] — <b>except</b> with [[Ag^+]], [[Hg2^2+]], [[Pb^2+]], [[Ca^2+]], [[Sr^2+]], [[Ba^2+]]</li></ul></div>' +
  '<div class="ref-card"><h3>Insoluble compounds</h3><ul><li>[[CO3^2-]], [[PO4^3-]], [[CrO4^2-]], [[S^2-]] — <b>except</b> with Group 1A cations and [[NH4^+]]</li><li>[[OH^-]] — <b>except</b> with Group 1A cations and [[Ba^2+]]</li></ul></div>' +
  '<div class="ref-card"><h3>Oxidation numbers</h3><ol><li>An element by itself: 0</li><li>The numbers sum to the overall charge</li><li>Then assign in this order of priority:<br>F = −1 · Group 1A = +1, Group 2A = +2 · H = +1 · O = −2 · other Group 7A = −1</li></ol><p style="color:var(--muted);font-size:.9rem">Exceptions come from higher-priority elements: H is −1 in metal hydrides; O is −1 in peroxides.</p></div>' +
  '<div class="ref-card"><h3>Equations</h3><p>M = mol solute ÷ L solution  ·  mol = M × L</p><p>M<sub>c</sub> × V<sub>c</sub> = M<sub>d</sub> × V<sub>d</sub></p><p>pH = −log[H<sub>3</sub>O<sup>+</sup>]  ·  [H<sub>3</sub>O<sup>+</sup>] = 10<sup>−pH</sup></p><p>mmol = M × mL</p></div>' +
  '<div class="ref-card wide"><h3>Activity series</h3><div class="series"><em>most easily oxidized</em>' + SERIES.map(e => '<span' + (e === 'H' ? ' class="h"' : '') + '>' + (e === 'H' ? 'H<sub>2</sub>' : e) + '</span>').join('') + '<em>least</em></div><p style="color:var(--muted);font-size:.9rem;margin-top:.5rem">A metal is oxidized by the ions of any element to its right. Metals to the left of hydrogen react with acids to release [[H2]] gas.</p></div>');
const ref = $('#ref');
$('#refBtn').addEventListener('click', () => { if (ref.showModal) ref.showModal(); else ref.setAttribute('open', ''); });
$('#refClose').addEventListener('click', () => { if (ref.close) ref.close(); else ref.removeAttribute('open'); });
ref.addEventListener('click', e => { if (e.target === ref && ref.close) ref.close(); });

/* text size */
const SIZES = ['', 'big', 'huge'], SIZE_LABEL = ['A', 'A+', 'A++'];
const applySize = () => { document.documentElement.className = SIZES[S.size || 0]; $('#sizeBtn').textContent = 'Text size: ' + SIZE_LABEL[S.size || 0]; };
$('#sizeBtn').addEventListener('click', () => { S.size = ((S.size || 0) + 1) % 3; applySize(); save(); });
applySize();

/* class timer */
const timerEl = $('#timer'); let run = false, base = 0, t0 = 0, iv = null;
const elapsed = () => base + (run ? Date.now() - t0 : 0);
function drawTimer() {
  const s = Math.floor(elapsed() / 1000), mm = Math.floor(s / 60), ss = s % 60, min = s / 60;
  timerEl.querySelector('.t-time').textContent = String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
  timerEl.querySelector('.t-ico').innerHTML = run ? '&#10074;&#10074;' : '&#9654;';
  const k = ENDS.findIndex(e => min < e);
  timerEl.querySelector('.t-pace').textContent = !s ? 'class timer' : k < 0 ? 'time — wrap up' : 'pace: Part ' + (k + 1);
  timerEl.classList.toggle('on', run); timerEl.classList.toggle('late', k < 0 && s > 0);
  timerEl.setAttribute('aria-label', (run ? 'Pause' : 'Start') + ' class timer, ' + mm + ' minutes elapsed');
}
timerEl.addEventListener('click', () => {
  if (run) { base = elapsed(); run = false; clearInterval(iv); } else { t0 = Date.now(); run = true; iv = setInterval(drawTimer, 1000); }
  drawTimer();
});
$('#timerReset').addEventListener('click', () => { run = false; base = 0; clearInterval(iv); drawTimer(); });
drawTimer();

refreshTabs();
show(S.part || 0, true);
})();
