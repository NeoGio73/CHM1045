<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoth Run — Nomenclature Flight Trainer</title>
<style>:root {
  --navy: #0d1b2a; --panel: rgba(11, 25, 41, 0.88); --panel-solid: #0f2236; --line: rgba(255, 255, 255, 0.16);
  --text: #f2f6fa; --muted: #a8bccd; --amber: #ffcf5c; --good: #3ee08f; --bad: #ff6b6f; --ice: #7fd3ff;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--navy); color: var(--text); font-family: var(--font); }
#app { position: relative; width: 100%; height: 100vh; height: 100dvh; min-height: 360px; overflow: hidden; background: #dfe8ef; outline: none; user-select: none; -webkit-user-select: none; }
#app:fullscreen { height: 100vh; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); }
.fx { white-space: nowrap; }
.fx sub { font-size: 0.68em; vertical-align: -0.28em; line-height: 0; }
.fx sup { font-size: 0.68em; vertical-align: 0.55em; line-height: 0; }
.fx .st { font-size: 0.8em; }

/* ---------- HUD ---------- */
#hud { position: absolute; top: 10px; left: 10px; right: 10px; display: grid; grid-template-columns: minmax(140px, 1fr) minmax(240px, 2.3fr) minmax(140px, 1fr);
  gap: 10px; align-items: start; pointer-events: none; z-index: 3; }
#hud[hidden] { display: none; }
.hud-box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.hud-left .label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.hud-left .name { font-weight: 700; font-size: 15px; margin: 1px 0 6px; }
.progress { height: 7px; background: rgba(255, 255, 255, 0.12); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--ice), #b8ecff); border-radius: 99px; transition: width 0.4s; }
.hud-left .count { font-size: 12px; color: var(--muted); margin-top: 5px; }
.qcard { text-align: center; padding: 9px 16px 11px; }
.qprompt { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); font-weight: 700; }
.qsubject { font-size: clamp(21px, 3.1vw, 36px); font-weight: 750; line-height: 1.25; margin-top: 2px; }
.hud-right { justify-self: end; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.hud-right .hud-box { display: flex; align-items: center; gap: 12px; }
.shields { display: flex; gap: 4px; }
.pip { width: 15px; height: 17px; background: var(--ice); clip-path: polygon(50% 0, 100% 22%, 100% 70%, 50% 100%, 0 70%, 0 22%); transition: background 0.3s, transform 0.3s; }
.pip.off { background: rgba(255, 255, 255, 0.18); transform: scale(0.85); }
.score { font-family: var(--mono); font-weight: 700; font-size: 15px; min-width: 4ch; text-align: right; }
.hud-btns { display: flex; gap: 6px; pointer-events: auto; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: grid; place-items: center; font-size: 16px; }
.icon-btn:hover { background: rgba(30, 60, 90, 0.95); }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.toast { position: absolute; left: 50%; transform: translate(-50%, -8px); top: 0; z-index: 4; padding: 8px 16px; border-radius: 99px; font-weight: 700;
  background: rgba(16, 96, 60, 0.94); border: 1px solid rgba(62, 224, 143, 0.6); opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.warn { background: rgba(110, 80, 10, 0.94); border-color: rgba(255, 207, 92, 0.6); }
.hint { position: absolute; left: 12px; bottom: 10px; z-index: 3; font-size: 12px; color: #33475b; background: rgba(255, 255, 255, 0.7); padding: 5px 10px; border-radius: 8px; pointer-events: none; }
.go { position: absolute; right: 14px; bottom: 14px; z-index: 4; padding: 12px 18px; border-radius: 12px; border: 0; background: var(--amber); color: #1b1404; font-weight: 800; cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25); }
.go[hidden], .hint[hidden], .toast[hidden] { display: none; }

/* ---------- typed answers ---------- */
.typed { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(660px, calc(100% - 20px)); z-index: 4;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px 8px; }
.typed[hidden] { display: none; }
.typed label { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); font-weight: 700; }
.typed-row { display: flex; gap: 8px; margin-top: 6px; }
.typed input { flex: 1; min-width: 0; font-size: 22px; padding: 9px 12px; border-radius: 10px; border: 2px solid rgba(127, 211, 255, 0.5); background: #07131f; color: #fff; font-family: var(--font); user-select: text; -webkit-user-select: text; }
.typed input:focus { outline: none; border-color: var(--ice); }
.typed-preview { min-height: 24px; font-size: 18px; margin-top: 6px; color: #d9ecfa; }
.typed-preview:empty { min-height: 0; margin: 0; }
.typed-preview .lbl { font-size: 12px; color: var(--muted); margin-right: 6px; }
.typed-msg { min-height: 18px; font-size: 14px; color: var(--amber); }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 4px 0; font-size: 13px; }

/* ---------- panels & screens ---------- */
.screen, .overlay { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(6, 16, 28, 0.5); padding: 16px; overflow: auto; }
.screen[hidden], .overlay[hidden] { display: none; }
.panel { width: min(640px, 100%); max-height: 100%; overflow: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35); }
.panel.wide { width: min(880px, 100%); }
.eyebrow { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ice); font-weight: 700; }
h1, h2, h3 { margin: 6px 0 10px; line-height: 1.15; }
h2 { font-size: 26px; } h3 { font-size: 16px; margin-top: 20px; color: var(--amber); }
.game-title { font-size: clamp(44px, 9vw, 76px); letter-spacing: 0.08em; font-weight: 900; margin: 4px 0 8px; background: linear-gradient(180deg, #ffffff, #b9d8ec); -webkit-background-clip: text; background-clip: text; color: transparent; }
.game-title span { color: var(--amber); -webkit-text-fill-color: var(--amber); }
.lede { color: #d6e3ee; font-size: 16px; line-height: 1.5; margin: 0 0 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.btn { border: 1px solid var(--line); background: rgba(255, 255, 255, 0.07); border-radius: 11px; padding: 10px 16px; font-weight: 650; cursor: pointer; }
.btn:hover { background: rgba(255, 255, 255, 0.13); }
.btn.primary { background: var(--amber); color: #1b1404; border-color: transparent; }
.btn.primary:hover { background: #ffd978; }
.btn.big { padding: 13px 22px; font-size: 17px; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.set { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); }
.seg { display: inline-flex; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 650; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ice); color: #06202f; }
details.howto { margin-top: 14px; font-size: 14px; color: #d6e3ee; }
details.howto summary { cursor: pointer; font-weight: 700; color: var(--text); }
details.howto ul { padding-left: 20px; line-height: 1.6; }
kbd { font-family: var(--mono); font-size: 12px; background: rgba(255, 255, 255, 0.12); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; }
.fine { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 16px 0 0; }
.sectors { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 10px; }
.sector-card { text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 14px; border-radius: 13px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); cursor: pointer; min-height: 118px; }
.sector-card:hover { background: rgba(127, 211, 255, 0.12); border-color: rgba(127, 211, 255, 0.5); }
.sector-card .num { font-size: 11px; letter-spacing: 0.14em; color: var(--ice); font-weight: 800; }
.sector-card .name { font-size: 17px; font-weight: 750; }
.sector-card .topic { font-size: 13px; color: var(--muted); }
.sector-card .best { margin-top: auto; font-size: 12px; color: var(--good); font-weight: 700; }
.sector-card.boss { border-color: rgba(255, 207, 92, 0.55); }
.sector-card.boss .num { color: var(--amber); }
.brief-grid { display: grid; grid-template-columns: 1fr 150px; gap: 16px; align-items: start; }
.brief-grid img { width: 100%; height: auto; }
.topic-line { color: var(--muted); margin-top: -4px; }
ul.rules { padding-left: 20px; line-height: 1.6; margin: 10px 0; }
.goal { font-size: 14px; color: #d6e3ee; background: rgba(127, 211, 255, 0.08); border: 1px solid rgba(127, 211, 255, 0.25); padding: 9px 12px; border-radius: 10px; }

/* feedback */
.fb-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fb-head h2 { margin: 0; }
.fb-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--bad); color: #2a0506; font-weight: 900; font-size: 20px; }
.chip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: rgba(255, 207, 92, 0.15); color: var(--amber); border: 1px solid rgba(255, 207, 92, 0.4); }
.fb-rows { margin: 14px 0 6px; display: grid; gap: 6px; }
.fb-row { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: baseline; font-size: 18px; }
.fb-row > span { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.good { color: var(--good); } .bad { color: var(--bad); }
.fb-why { font-size: 16px; line-height: 1.5; margin: 12px 0 6px; }
.fb-exp { font-size: 15px; line-height: 1.5; color: #cfe0ec; margin: 6px 0 0; padding: 10px 12px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
.fb-shields { font-size: 13px; color: var(--muted); margin-top: 10px; }

/* debrief */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0 6px; }
.stats > div { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.stats b { display: block; font-size: 24px; font-family: var(--mono); }
.stats span { font-size: 12px; color: var(--muted); }
.cats { display: grid; gap: 8px; }
.cat { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 9px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); }
.cat b { font-size: 15px; } .cat .n { font-family: var(--mono); color: var(--bad); font-weight: 800; }
.cat .tip { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
ol.misses { padding-left: 22px; display: grid; gap: 10px; margin: 8px 0; }
ol.misses li { line-height: 1.45; }
.mq { font-weight: 650; } .mine, .right { font-size: 15px; } .why { font-size: 13px; color: var(--muted); }
table.log { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
table.log th, table.log td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.log th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }

@media (min-width: 900px) and (orientation: landscape) { .typed { left: 16px; transform: none; width: min(560px, 46%); } }
@media (max-height: 520px) { .typed { padding: 7px 10px 4px; } .typed label { display: none; } .typed-row { margin-top: 0; } .typed input { font-size: 18px; padding: 6px 10px; }
  .typed-msg:empty { min-height: 0; } .link { padding: 2px 0; } }
@media (max-width: 720px) {
  #hud { grid-template-columns: 1fr auto; }
  .qcard { grid-column: 1 / -1; order: 3; padding: 7px 12px 9px; }
  .hud-left .name { font-size: 13px; margin-bottom: 4px; }
  .brief-grid { grid-template-columns: 1fr; } .brief-grid img { width: 120px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .panel { padding: 18px 16px; }
  .hint { display: none; }
}
@media (max-height: 520px) { .qsubject { font-size: 20px; } .hud-left .count { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app" tabindex="-1">
  <canvas id="cv" aria-hidden="true"></canvas>
  <div id="hud" hidden>
    <div class="hud-box hud-left">
      <div class="label" id="hud-sector">Sector 1</div>
      <div class="name" id="hud-name"></div>
      <div class="progress" aria-hidden="true"><div id="hud-bar"></div></div>
      <div class="count" id="hud-count"></div>
    </div>
    <div class="hud-box qcard" id="qcard"><div class="qprompt" id="q-prompt"></div><div class="qsubject" id="q-subject"></div></div>
    <div class="hud-right">
      <div class="hud-box"><div class="shields" id="hud-shields" role="img" aria-label="Shields"></div><div class="score" id="hud-score" aria-label="Score">0</div></div>
      <div class="hud-btns">
        <button class="icon-btn" id="btn-pause" type="button" aria-label="Pause (P)" title="Pause (P)"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
        <button class="icon-btn" id="btn-sound" type="button" aria-label="Sound (M)" title="Sound (M)"></button>
        <button class="icon-btn" id="btn-full" type="button" aria-label="Full screen" title="Full screen"></button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="hint" class="hint" hidden></div>
  <button id="btn-go" class="go" type="button" hidden>Fly through ▶</button>
  <form id="typed" class="typed" hidden autocomplete="off">
    <label for="typed-input" id="typed-label">Type the formula</label>
    <div class="typed-row">
      <input id="typed-input" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">
      <button type="submit" class="btn primary">Fire cable ⏎</button>
    </div>
    <div class="typed-preview" id="typed-preview" aria-hidden="true"></div>
    <div class="typed-msg" id="typed-msg" role="status"></div>
    <button type="button" id="typed-skip" class="link">Show me the answer (costs a shield)</button>
  </form>
  <div id="feedback" class="overlay" hidden><div class="panel" id="fb-panel" role="dialog" aria-modal="true" aria-labelledby="fb-title"></div></div>
  <section id="screen" class="screen"><div class="panel" id="screen-panel" role="dialog" aria-modal="true"></div></section>
  <div id="live" class="sr-only" aria-live="polite"></div>

  function hideFlightBits() { $('typed').hidden = true; $('btn-go').hidden = true; $('hint').hidden = true; $('feedback').hidden = true; }
  function ambient() { S.gate = null; Object.assign(S.player, { mode: 'fly', visible: true, offX: 0, tilt: 0, scale: 1, flip: false, behind: false }); S.player.ty = S.H * 0.55; }
  function onSetting(key, v) {
    st[key] = v; store.set(key, v);
    if (key === 'sound') { X.on = v; setIcons(); if (v) { X.unlock(); X.click(); } }
    if (key === 'reduced') { S.reduced = v; S.resize(); layoutBand(); }
  }
  function setIcons() {
    $('btn-sound').innerHTML = st.sound ? UI.ICON.soundOn : UI.ICON.soundOff;
    $('btn-sound').setAttribute('aria-pressed', String(st.sound));
    const b = $('btn-full'); b.innerHTML = canFS ? UI.ICON.full : UI.ICON.pop; b.hidden = !canFS && !inFrame;
    b.setAttribute('aria-label', canFS ? 'Full screen' : 'Open in a new window'); b.title = b.getAttribute('aria-label');
  }
  function fullscreen() {
    if (canFS) { if (document.fullscreenElement) document.exitFullscreen(); else app.requestFullscreen().catch(popout); }
    else popout();
  }
  function popout() { window.open(location.href, '_blank', 'noopener'); }
  function toggleSound() { onSetting('sound', !st.sound); }

  $('screen-panel').addEventListener('click', e => {
    const card = e.target.closest('[data-sector]'); if (card) { X.unlock(); X.click(); return showBrief(+card.dataset.sector); }
    const b = e.target.closest('[data-act]'); if (!b) return; X.unlock(); X.click();
    switch (b.dataset.act) {
      case 'start': return showBrief(1);
      case 'map': return showMap();
      case 'title': return showTitle();
      case 'launch': return startSector(pendingSector);
      case 'resume': return resume();
      case 'restart': if (run && !run.total) session.splice(session.indexOf(run), 1); return startSector(run.sec.id);
      case 'next': return showBrief(run.sec.id + 1);
      case 'again': return startSector(run.sec.id);
      case 'full': return fullscreen();
    }
  });

  // ---------- sector flow ----------
  function startSector(id) {
    const sec = Q.SECTORS.find(s => s.id === id);
    run = { sec, correct: 0, total: 0, streak: 0, bestStreak: 0, score: 0, shields: CFG.shields, misses: [], recent: [], cleared: false, lane: 1, q: null, phase: 'cruise', t: 0.9, softTries: 0, tapLane: -1 };
    session.push(run);
    S.setEnemies(sec.enemy); ambient();
    UI.closeScreen(); hideFlightBits(); $('hud').hidden = false; UI.hud(run, CFG); UI.question(null);
    state = 'flight'; layoutBand(); S.player.ty = (S.bandTop + S.bandBottom) / 2;
    if (sec.boss) { run.phase = 'intro'; run.t = 2.8; UI.toast('The walker is closing in. Ready the tow cable!', 'warn', 2600); }
    else { $('hint').hidden = false; $('hint').textContent = touch ? 'Tap an answer, then tap it again to fly through' : '↑ ↓ or 1–4 to choose · Enter to fly through · P to pause'; }
    app.focus({ preventScroll: true });
  }
  function newQuestion() {
    const r = run, q = Q.next(r.sec.id, r.recent); r.q = q; r.recent.push(q.key); if (r.recent.length > 14) r.recent.shift();
    const n = q.options.length; r.lane = Math.max(0, Math.min(n - 1, r.lane)); r.tapLane = -1;
    UI.question(q); layoutBand();
    const x0 = spawnX();
    S.gate = { x: x0, v: (x0 - hitX()) / (CFG.approachSeconds[st.speed] || 10), alpha: 0, sel: r.lane, opts: q.options.map(o => ({ text: o.text, isF: o.isF, state: null })) };
    S.player.ty = S.laneY(r.lane, n).y;
    r.phase = st.mode === 'untimed' ? 'hold' : 'approach';
    $('btn-go').hidden = false;
    UI.say(`${q.prompt}: ${F.showUni(q.subject.text, q.subject.isF)}. ` + q.options.map((o, i) => `Gate ${i + 1}: ${F.showUni(o.text, o.isF)}`).join('. ') + '.');
  }
  const gateActive = () => state === 'flight' && run && !run.sec.boss && S.gate && ['approach', 'hold', 'rush'].includes(run.phase);
  function setLane(i, fromTap) {
    if (!gateActive()) return; const n = run.q.options.length; i = Math.max(0, Math.min(n - 1, i));
    if (i !== run.lane) X.click(); run.lane = i; S.gate.sel = i; S.player.ty = S.laneY(i, n).y; run.tapLane = fromTap ? i : -1;
  }
  function commit() { if (gateActive() && run.phase !== 'rush') { run.phase = 'rush'; X.whoosh(); } }

  function resolve() {
    const r = run, q = r.q, g = S.gate, opt = q.options[r.lane];
    $('btn-go').hidden = true; g.x = hitX(); r.total++;
    g.opts[q.options.findIndex(o => o.correct)].state = 'right';
    if (opt.correct) {
      r.correct++; r.streak++; r.bestStreak = Math.max(r.bestStreak, r.streak); r.score += 100 + 25 * Math.min(r.streak - 1, 6);
      let msg = '✓ Correct';
      if (CFG.shieldBonusStreak && r.streak % CFG.shieldBonusStreak === 0 && r.shields < CFG.shields) { r.shields++; msg += ' · shield restored'; }
      X.good(); S.fire(); UI.toast(msg); UI.say('Correct. ' + (msg.includes('shield') ? 'Shield restored.' : '')); UI.hud(r, CFG);
      r.phase = 'after'; r.t = 0.9;
    } else {
      g.opts[r.lane].state = 'wrong'; r.streak = 0; r.shields--;
      S.burst(g.x, S.laneY(r.lane, q.options.length).y, { n: 30, speed: 260, life: 0.9, size: 5, colors: ['#e8f7ff', '#bfe3f7', '#ffffff'], g: 300, kind: 'shard' });
      X.bad(); S.enemyFire(); S.shake = 10;
      r.misses.push({ q, chosen: opt.text, chosenIsF: opt.isF, cat: opt.cat || q.cat, why: opt.why });
      UI.hud(r, CFG); r.phase = 'wait';
      setTimeout(() => showFeedback({ q, chosen: UI.show(opt.text, opt.isF), cat: opt.cat, why: opt.why, shields: r.shields }), 480);
    }
  }
  function showFeedback(o) {
    state = 'feedback'; $('typed').hidden = true;
    const p = $('fb-panel'); p.innerHTML = UI.feedbackHTML(o, CFG); $('feedback').hidden = false; p.scrollTop = 0;
    UI.say(`Incorrect. The answer is ${F.showUni(o.q.answer.text, o.q.answer.isF)}. ${F.richUni(o.why || '')} ${F.richUni(o.q.explain)}`);
    const b = p.querySelector('[data-act=continue]'); b.addEventListener('click', afterFeedback, { once: true }); setTimeout(() => b.focus(), 40);
  }
  function afterFeedback() {
    X.click(); $('feedback').hidden = true; state = 'flight'; last = performance.now(); app.focus({ preventScroll: true });
    if (run.shields <= 0) return crash();
    if (run.sec.boss) nextTyped(); else { run.phase = 'after'; run.t = 0.6; }
  }
  function sectorClear() {
    const r = run; r.cleared = true; r.phase = 'end'; $('btn-go').hidden = true; $('hint').hidden = true; UI.question(null);
    UI.toast('Sector clear!', '', 2200); UI.say('Sector clear.'); S.killAll();
    setTimeout(() => { if (run === r) { S.player.mode = 'exit'; X.whoosh(); } }, 1300);
    setTimeout(() => finish(r), 2700);
  }
  function crash() {
    const r = run; r.phase = 'end'; hideFlightBits(); UI.question(null); UI.toast('Shields down!', 'warn', 1800); UI.say('Shields down.');
    S.player.mode = 'crash'; S.player.vy = -80; S.player.onDown = () => { X.boom(); setTimeout(() => finish(r), 1500); };
  }
  function finish(r) {
    if (!r || r !== run || state === 'debrief') return;
    const acc = r.total ? Math.round(100 * r.correct / r.total) : 0, b = best[r.sec.id] || { acc: 0, cleared: false };
    best[r.sec.id] = { acc: Math.max(b.acc, acc), cleared: b.cleared || r.cleared }; store.set('best', best);
    $('hud').hidden = true; hideFlightBits(); S.gate = null; state = 'debrief';
    UI.openScreen(UI.debriefHTML(r, session, r.sec.id < Q.SECTORS.length), r.cleared && r.sec.id < Q.SECTORS.length ? '[data-act=next]' : '[data-act=again]');
    ambient(); if (!r.sec.boss) S.setEnemies(r.sec.enemy);
  }

  // ---------- boss (typed answers) ----------
  function nextTyped() {
    const r = run, q = Q.next(r.sec.id, r.recent); r.q = q; r.recent.push(q.key); if (r.recent.length > 24) r.recent.shift();
    r.softTries = 0; r.phase = 'typing'; UI.question(q); layoutBand();
    $('typed').hidden = false; $('typed-label').textContent = q.typedPrompt;
    const inp = $('typed-input'); inp.value = ''; inp.placeholder = q.answer.isF ? 'e.g. Fe2(SO4)3' : 'e.g. iron(III) sulfate';
    $('typed-preview').innerHTML = ''; $('typed-msg').textContent = '';
    setTimeout(() => inp.focus({ preventScroll: true }), 40);
    UI.say(`${q.typedPrompt}: ${F.showUni(q.subject.text, q.subject.isF)}.`);
  }
  $('typed-input').addEventListener('input', () => {
    if (!run || !run.q) return; const v = $('typed-input').value;
    $('typed-preview').innerHTML = v.trim() && run.q.answer.isF ? `<span class="lbl">Reads as</span>${F.html(F.normFormula(v).replace(/[^A-Za-z0-9().]/g, ''))}` : '';
  });
  $('typed').addEventListener('submit', e => {
    e.preventDefault(); const r = run; if (!r || r.phase !== 'typing' || state !== 'flight') return;
    const val = $('typed-input').value, res = Q.check(r.q, val);
    if (res.status === 'empty') { $('typed-msg').textContent = 'Type an answer first.'; return; }
    if (res.status === 'soft' && r.softTries < 2) { r.softTries++; $('typed-msg').textContent = res.msg; X.soft(); UI.say(res.msg); return; }
    typedResult(res.status === 'correct', val, res);
  });
  $('typed-skip').addEventListener('click', () => { if (run && run.phase === 'typing' && state === 'flight') typedResult(false, '', { cat: run.q.cat }, true); });
  function typedResult(ok, val, res, skipped) {
    const r = run; r.total++; $('typed').hidden = true;
    if (ok) {
      r.correct++; r.streak++; r.bestStreak = Math.max(r.bestStreak, r.streak); r.score += 150 + 25 * Math.min(r.streak - 1, 6);
      let msg = '✓ Correct — cable away!';
      if (CFG.shieldBonusStreak && r.streak % CFG.shieldBonusStreak === 0 && r.shields < CFG.shields) { r.shields++; msg += ' Shield restored.'; }
      X.good(); UI.toast(msg, '', 1800); UI.say('Correct.'); r.phase = 'loop'; UI.hud(r, CFG);
      S.bossLoop(() => { UI.hud(r, CFG); if (S.boss.loops >= CFG.cableLoops) bossDown(); else nextTyped(); });
    } else {
      r.streak = 0; r.shields--; X.bad(); S.enemyFire(); r.phase = 'wait'; UI.hud(r, CFG);
      const shown = skipped ? '<i>(skipped)</i>' : r.q.answer.isF ? F.html(F.normFormula(val).replace(/[^A-Za-z0-9().^+\-]/g, '')) : F.esc(val);
      r.misses.push({ q: r.q, chosen: skipped ? '(skipped)' : r.q.answer.isF ? F.normFormula(val) : val, chosenIsF: !skipped && r.q.answer.isF, cat: res.cat || r.q.cat, why: res.why || res.msg || null });
      setTimeout(() => showFeedback({ q: r.q, chosen: shown, typed: true, title: skipped ? 'Here’s how it works' : 'Not quite', cat: res.cat || r.q.cat, why: res.why || res.msg, shields: r.shields }), 520);
    }
  }
  function bossDown() {
    const r = run; r.phase = 'end'; r.cleared = true; UI.question(null); $('typed').hidden = true;
    UI.toast('The cable holds! It’s going down…', '', 2200); UI.say('The walker is falling.');
    setTimeout(() => { if (run === r) S.bossFall(() => { UI.toast('Walker down!', '', 2600); UI.say('Walker down!'); setTimeout(() => finish(r), 2400); }); }, 700);
  }

  // ---------- per-frame logic ----------
  function tick(dt) {
    const r = run; if (!r) return;
    if (r.sec.boss) { S.speed += (35 - S.speed) * Math.min(1, dt * 2); if (r.phase === 'intro' && (r.t -= dt) <= 0) nextTyped(); return; }
    const g = S.gate;
    switch (r.phase) {
      case 'cruise': S.speed += (380 - S.speed) * Math.min(1, dt * 3); if ((r.t -= dt) <= 0) newQuestion(); break;
      case 'approach': g.alpha = Math.min(1, g.alpha + dt * 3); g.x -= g.v * dt; S.speed = g.v; if (g.x <= hitX()) resolve(); break;
      case 'hold': g.alpha = Math.min(1, g.alpha + dt * 3); S.speed += (0 - S.speed) * Math.min(1, dt * 2); break;
      case 'rush': { const v = Math.max(750, (g.x - hitX()) / 0.3); g.alpha = 1; g.x -= v * dt; S.speed = Math.min(v, 650); if (g.x <= hitX()) resolve(); break; }
      case 'after': g.x -= 520 * dt; g.alpha = Math.max(0, g.alpha - dt * 1.5); S.speed += (380 - S.speed) * Math.min(1, dt * 3);
        if ((r.t -= dt) <= 0) { S.gate = null; if (r.correct >= CFG.targetsPerSector) sectorClear(); else { r.phase = 'cruise'; r.t = 0.5; } } break;
      case 'end': S.speed += (260 - S.speed) * Math.min(1, dt); break;
    }
  }
  let slow = 0, frames = 0;
  function loop(now) {
    const raw = (now - last) / 1000 || 0, dt = Math.min(0.1, raw); last = now;
    if (raw > 0 && raw < 1) { frames++; if (raw > 1 / 32) slow++; if (frames >= 90) { if (slow > 60 && S.quality > 0.55) { S.quality = S.quality > 0.8 ? 0.75 : 0.55; S.resize(); layoutBand(); } frames = slow = 0; } }
    if (state !== 'paused') { const n = dt > 0.04 ? 2 : 1; for (let i = 0; i < n; i++) { S.update(dt / n); if (state === 'flight') tick(dt / n); } }
    S.render(state === 'paused' ? 0 : dt);
    requestAnimationFrame(loop);
  }
  function pause() {
    if (state !== 'flight' || !run || run.phase === 'end') return;
    state = 'paused'; UI.openScreen(UI.pauseHTML(st), '[data-act=resume]'); bindScreen();
  }
  function resume() {
    if (state !== 'paused') return; UI.closeScreen(); state = 'flight'; last = performance.now();
    if (run && run.phase === 'hold' && S.gate) S.gate.v = (spawnX() - hitX()) / (CFG.approachSeconds[st.speed] || 10);
    if (run && run.phase === 'typing') $('typed-input').focus({ preventScroll: true }); else app.focus({ preventScroll: true });
  }

  // ---------- input ----------
  window.addEventListener('keydown', e => {
    X.unlock(); const k = e.key, typing = document.activeElement && document.activeElement.id === 'typed-input';
    if (gateActive() && !typing) {
      const n = run.q.options.length;
      if (k === 'ArrowUp' || k === 'w' || k === 'W') { setLane(run.lane - 1); e.preventDefault(); return; }
      if (k === 'ArrowDown' || k === 's' || k === 'S') { setLane(run.lane + 1); e.preventDefault(); return; }
      if (/^[1-9]$/.test(k) && +k <= n) { setLane(+k - 1); e.preventDefault(); return; }
      if ((k === 'Enter' || k === ' ') && (!document.activeElement || !/BUTTON|A/.test(document.activeElement.tagName) || document.activeElement.id === 'btn-go')) { commit(); e.preventDefault(); return; }
    }
    if (k === 'Escape' || ((k === 'p' || k === 'P') && !typing)) {
      if (state === 'flight') { pause(); e.preventDefault(); } else if (state === 'paused') { resume(); e.preventDefault(); }
      return;
    }
    if ((k === 'm' || k === 'M') && !typing) { toggleSound(); return; }
    if (state === 'flight' && !typing && (k === 'ArrowUp' || k === 'ArrowDown' || k === ' ')) e.preventDefault();
  });
  $('cv').addEventListener('pointerdown', e => {
    X.unlock(); if (!gateActive()) return;
    const y = e.clientY - $('cv').getBoundingClientRect().top, lane = S.laneAt(y, run.q.options.length);
    if (lane < 0) return; if (lane === run.tapLane) commit(); else setLane(lane, true);
  });
  $('btn-go').addEventListener('click', () => { X.unlock(); commit(); });
  $('btn-pause').addEventListener('click', () => { X.unlock(); pause(); });
  $('btn-sound').addEventListener('click', () => { X.unlock(); toggleSound(); });
  $('btn-full').addEventListener('click', fullscreen);
  const autoPause = () => { if (state === 'flight' && run && ['approach', 'rush', 'cruise'].includes(run.phase)) pause(); };
  window.addEventListener('blur', autoPause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
  window.addEventListener('resize', onResize);
  document.addEventListener('fullscreenchange', () => setTimeout(onResize, 60));

  // ---------- boot ----------
  async function boot() {
    S.init($('cv')); S.reduced = st.reduced; X.on = st.sound;
    let assets = {}; try { assets = JSON.parse($('hoth-assets').textContent); } catch (e) { /* no images: placeholders */ }
    await S.loadAssets(assets);
    S.setEnemies('probe'); S.speed = 90; ambient(); S.player.y = S.player.ty;
    setIcons(); onResize(); showTitle(); last = performance.now(); requestAnimationFrame(loop);
    G.__hoth = { get state() { return state; }, get run() { return run; }, startSector, showBrief, S, Q }; // test hook
  }
  boot();
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
